# Unsupported Neovim builds targeting glibc 2.17.
# This tool name is intentionally separate from the standard `neovim` tool.

[tool_alias]
neovim-oldglibc = "github:neovim/neovim-releases"
yazi-musl = "github:sxyazi/yazi"
procs = "aqua:dalance/procs"
dust = "github:bootandy/dust"
ouch = "github:ouch-org/ouch"

[tools.neovim-oldglibc]
version = "latest"
os = ["linux/x64"]
asset_pattern = "nvim-linux-x86_64.tar.gz"
strip_components = 1
bin_path = "bin"
# Keep this out of a bare `mise install`. The unreachable placeholder avoids
# attaching lazy installation to `nvim`, so installation remains explicit-only.
lazy = true
lazy_bins = ["__mise_manual_neovim_oldglibc__"]

[tools.yazi-musl]
version = "latest"
os = ["linux/x64"]
asset_pattern = "yazi-x86_64-unknown-linux-musl.zip"
strip_components = 1
bin_path = "."
# Keep this out of a bare `mise install`. The unreachable placeholder avoids
# attaching lazy installation to `yazi`/`ya`, so installation remains explicit-only.
lazy = true
lazy_bins = ["__mise_manual_yazi_musl__"]

[tools]
neovim = "nightly"
yazi = { version = "latest", lazy = true }
lazygit = { version = "latest", lazy = true }
lazydocker = { version = "latest", lazy = true }
fzf = { version = "latest", lazy = true }
btop = { version = "latest", lazy = true }
starship = { version = "latest", lazy = true }
fd = { version = "latest", lazy = true }
ripgrep = { version = "latest", lazy = true }
tmux = "3.6b"
duckdb = "latest"

[tools.dust]
version = "latest"
lazy = true

[tools.dust.platforms]
linux-x64 = { asset_pattern = "dust-v*-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "dust-v*-aarch64-unknown-linux-musl.tar.gz" }

[tools.procs]
version = "latest"
lazy = true
lazy_bins = ["procs"]

[tools.ouch]
version = "latest"
lazy = true
lazy_bins = ["ouch"]

[tools.ouch.platforms]
linux-x64 = { asset_pattern = "ouch-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "ouch-aarch64-unknown-linux-musl.tar.gz" }

# broot's GitHub release bundles every platform's binary into a single zip
# instead of per-platform assets, so the usual github backend can't target it.
# Build from crates.io via the cargo backend instead.
[tools."cargo:broot"]
version = "latest"
lazy = true
lazy_bins = ["broot"]
