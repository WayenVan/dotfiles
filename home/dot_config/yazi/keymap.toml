[[mgr.prepend_keymap]]
on = "'"
run = ["toggle", "arrow 1"]
desc = "Toggle the current selection state"

[[mgr.prepend_keymap]]
on = ";"
run = ["toggle", "arrow 1"]
desc = "Toggle the current selection state"

[[mgr.prepend_keymap]]
on = "!"
run = "shell --interactive"
desc = "Run a shell command"

[[mgr.prepend_keymap]]
on = "<Space>"
run = "noop"
desc = "Freed up as a leader key prefix"

[[mgr.prepend_keymap]]
on = ["<Space>", "-"]
run = "link --relative"
desc = "Symlink the relative path of yanked files"

[[mgr.prepend_keymap]]
on = ["<Space>", "_"]
run = "link"
desc = "Symlink the absolute path of yanked files"

[[mgr.prepend_keymap]]
on = ["<Space>", "<Space>"]
run = "plugin fzf-dir"
desc = "Jump to a file/directory via fzf (includes dirs, Alt-I/Alt-R toggle .gitignore)"

[[mgr.prepend_keymap]]
on = ["<Space>", "f", "f"]
run = "plugin fzf-dir -- dir"
desc = "Jump to a directory only via fzf (Alt-I/Alt-R toggle .gitignore)"

[[mgr.prepend_keymap]]
on = "-"
run = "noop"
desc = "Reserved for Oil in Neovim"

[[mgr.prepend_keymap]]
on = "_"
run = "noop"
desc = "Unbind the default relative symlink key"

[[mgr.prepend_keymap]]
on = "<C-o>"
run = "back"
desc = "Go back in directory history"

[[mgr.prepend_keymap]]
on = "<C-i>"
run = "forward"
desc = "Go forward in directory history"

# Legacy terminals send Ctrl+i as Tab; file information remains on K.
[[mgr.prepend_keymap]]
on = "<Tab>"
run = "forward"
desc = "Go forward in directory history"

[[mgr.prepend_keymap]]
on = "K"
run = "spot"
desc = "Show file information"

# Use Alt+hjkl for preview scrolling, keeping plain keys for navigation.
[[mgr.prepend_keymap]]
on = "<A-k>"
run = "seek -5"
desc = "Scroll preview up (toggle DuckDB mode at the top)"

[[mgr.prepend_keymap]]
on = "<A-j>"
run = "seek 5"
desc = "Scroll preview down"

[[mgr.prepend_keymap]]
on = "<A-h>"
run = "plugin duckdb -- -1"
desc = "Scroll DuckDB preview one column left"

[[mgr.prepend_keymap]]
on = "<A-l>"
run = "plugin duckdb -- +1"
desc = "Scroll DuckDB preview one column right"

[[mgr.prepend_keymap]]
on = "<A-c>"
run = "plugin ouch"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = "s"
run = "noop"
desc = "Unbind, moved to <Space>j / <Space>k"

[[mgr.prepend_keymap]]
on = ["<Space>", "j"]
run = "plugin easyjump"
desc = "Jump to a visible file"

[[mgr.prepend_keymap]]
on = ["<Space>", "k"]
run = "plugin easyjump"
desc = "Jump to a visible file"

[[mgr.prepend_keymap]]
on = "S"
run = "search --via=fd"
desc = "Search files by name via fd"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "cd sftp://uofg"
desc = "Go to uofg VFS"

[[mgr.prepend_keymap]]
on = "<c-p>"
run = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on = ["u", "c"]
run = "plugin toggle-pane max-current"
desc = "Maximize or restore the current pane"

[[mgr.prepend_keymap]]
on = ["u", "p"]
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = ["u", "r"]
run = "plugin toggle-pane reset"
desc = "Reset pane layout"
