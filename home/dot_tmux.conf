# ============================================================
# Terminal / rendering
# ============================================================
set -g default-terminal "tmux-256color"
set -g default-command "${SHELL}"

# Forward terminal focus-in/focus-out events to applications in each pane.
set -g focus-events on

set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:rgb'

# Declare synchronized-output (DECSET 2026) support so nvim actually wraps
# its redraws in Sync start/end instead of drawing unprotected — without
# this nvim won't know tmux/the outer terminal can do atomic frame flushes,
# and partial redraws can flash to the wrong spot before settling.
# kitty and wezterm both support it natively. The `sync` feature itself was
# only added in tmux 3.7, so guard it to avoid an unknown-feature value on
# older tmux (3.2 included).
if-shell -F '#{>=:#{version},3.7}' "set -as terminal-features 'xterm*:sync'"
if-shell -F '#{>=:#{version},3.7}' "set -as terminal-features 'wezterm*:sync'"

# Allow escape-sequence passthrough (needed for e.g. kitty graphics protocol /
# sixel image previews tunneled through tmux). Introduced in tmux 3.3.
if-shell -F '#{>=:#{version},3.3}' 'set -g allow-passthrough on'

# ============================================================
# Clipboard & buffers
# ============================================================
# OSC 52 clipboard support for local and SSH sessions in kitty.
# `on` lets applications inside tmux (for example Neovim) set the clipboard.
set -s set-clipboard on
set -as terminal-features ',xterm-kitty:clipboard'
# tmux 3.6+: 64 MiB OSC/control sequence allows about 48 MiB of decoded text.
if-shell -F '#{>=:#{version},3.6}' 'set -s input-buffer-size 67108864'
set -g history-limit 10000

# ============================================================
# Key handling / timing
# ============================================================
# Only forward extended keys to applications that ask for them (pi, nvim,
# codex, claude... all request modifyOtherKeys/kitty on startup). `always`
# would push CSI-u at programs that never asked for it (plain `read`, `cat`,
# unaware TUIs) and garbles their input, while giving those apps that do
# request it exactly the same bytes as `on`. `on` exists since 3.2;
# extended-keys-format needs 3.5+, so it stays version-guarded to keep tmux
# 3.2 compatible (and 3.2-3.4 fall back to the `xterm` format, which pi also
# understands). Needs the `extkeys` terminal-feature above so tmux can ask the
# outer terminal (kitty) for extended keys in the first place.
set -s extended-keys on
if-shell -F '#{>=:#{version},3.5}' 'set -s extended-keys-format csi-u'

set -g escape-time 0
set -g repeat-time 1000

# ============================================================
# General options
# ============================================================
set -g mouse on
set -g prefix C-a
set -g status-position top

# Frees C-p (root, no prefix) so it passes through to apps, e.g. oil.nvim's preview binding.
unbind-key -n C-p

# ============================================================
# Key bindings
# ============================================================
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Start new windows and panes in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Toggle mouse on/off with 'Prefix + m'
bind-key m set -g mouse

# Describe the current session (shown next to its name in the status bar);
# submit an empty string to clear it.
bind-key e command-prompt -I "#{@desc}" -p "Session description:" \
  "if-shell -F '#{==:%1,}' 'set-option -qu @desc' \"set-option -q @desc '%1'\""

# Window navigation
bind-key [ previous-window
bind-key ] next-window
unbind-key Tab
unbind-key o
unbind-key C-o

# Prefix-based history toggles: pane, window, and session.
bind-key o select-pane -l
bind-key O last-window
bind-key Tab switch-client -l

# Match the default Prefix + q behavior: show pane numbers and select one.
set -g display-panes-time 60000
bind-key Space display-panes

# Pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize the current pane; repeat the direction key for continuous resizing.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Evenly distribute panes without replacing the current layout structure.
bind-key = select-layout -E

# Pick any pane by number and swap it with the current pane.
bind-key S display-panes -d 0 'swap-pane -d -t "%%"'

# Floating shell: Prefix + /.
bind-key / display-popup -E -w 80% -h 80%

# Vim-style copy mode: Prefix + v to enter, v to select, y to copy.
setw -g mode-keys vi
bind-key v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' \
  'send-keys -X clear-selection' \
  'send-keys -X cancel'

# ============================================================
# Status bar — Catppuccin Mocha colorscheme
# ============================================================
ROSEWATER="#f5e0dc"
FLAMINGO="#f2cdcd"
PINK="#f5c2e7"
MAUVE="#cba6f7"
RED="#f38ba8"
MAROON="#eba0ac"
PEACH="#fab387"
YELLOW="#f9e2af"
GREEN="#a6e3a1"
TEAL="#94e2d5"
SKY="#89dceb"
SAPPHIRE="#74c7ec"
BLUE="#89b4fa"
LAVENDER="#b4befe"

# Base colors
CRUST="#11111b"       # crust
MANTLE="#181825"      # mantle
BG="#1e1e2e"          # base
FG="#cdd6f4"          # text

# Additional surface colors
SURFACE0="#313244"    # surface0
SURFACE1="#45475a"    # surface1
SURFACE2="#585b70"    # surface2
OVERLAY0="#6c7086"    # overlay0
OVERLAY1="#7f849c"    # overlay1
OVERLAY2="#9399b2"    # overlay2
SUBTEXT0="#a6adc8"    # subtext0
SUBTEXT1="#bac2de"    # subtext1

# Make the active pane obvious without changing application colors.
set-option -g pane-border-style "fg=${SURFACE0}"
set-option -g pane-active-border-style "fg=${MAUVE},bold"
set-option -g pane-border-status off
set-hook -g after-split-window 'set-option -w pane-border-status top'
set-hook -g after-kill-pane 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status top" "set-option -w pane-border-status off"'
set-hook -g pane-exited 'run-shell "if [ #{window_panes} -eq 1 ]; then tmux set-option -w -t #{window_id} pane-border-status off; fi"'
set-option -g pane-border-format "#{?pane_active,#[fg=${MAUVE}]#[bold],#[fg=${OVERLAY0}]} #P #{pane_current_command} #[default]"

# Nerdfont characters
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"

# Basic colors of the Statusbar
set-option -g status-style bg=${BG},fg=${FG}

# Window list on the left; the session name gets the centre of the bar.
set-option -g status-justify left
set-option -g status-left ""

# Session name (plus its optional @desc) centred; mode indicators, host
# (SSH only) and time on the right.
# status-right is drawn in the right-aligned slot, so the leading
# #[align=absolute-centre] moves the session pill to the exact middle of the bar and
# #[align=right] switches back for the rest.
set-option -g status-right "\
#[align=absolute-centre]\
#[fg=${MAUVE},bg=default]${HALF_ROUND_OPEN}\
#[bg=${MAUVE},fg=${BG},bold]#S \
#{?#{@desc},#[bg=${SURFACE1}#,fg=${SUBTEXT1}#,nobold] #{=/40/…:@desc}#[fg=${SURFACE1}#,bg=default],#[fg=${MAUVE}#,bg=default]}\
${HALF_ROUND_CLOSE}#[nobold]\
#[align=right]\
#{?client_prefix,#[fg=${RED}]#[bg=default]${HALF_ROUND_OPEN}#[fg=${BG}]#[bg=${RED}]#[bold]PREFIX#[nobold]#[fg=${RED}]#[bg=default]${HALF_ROUND_CLOSE} ,}\
#{?pane_in_mode,#[fg=${YELLOW}]#[bg=default]${HALF_ROUND_OPEN}#[fg=${BG}]#[bg=${YELLOW}]#[bold]COPY#[nobold]#[fg=${YELLOW}]#[bg=default]${HALF_ROUND_CLOSE} ,}\
#{?window_zoomed_flag,#[fg=${BLUE}]#[bg=default]${HALF_ROUND_OPEN}#[fg=${BG}]#[bg=${BLUE}]#[bold]ZOOM#[nobold]#[fg=${BLUE}]#[bg=default]${HALF_ROUND_CLOSE} ,}\
#{?pane_synchronized,#[fg=${PEACH}]#[bg=default]${HALF_ROUND_OPEN}#[fg=${BG}]#[bg=${PEACH}]#[bold]SYNC#[nobold]#[fg=${PEACH}]#[bg=default]${HALF_ROUND_CLOSE} ,}\
#{?@ssh,\
#[fg=${SURFACE1}#,bg=default]${HALF_ROUND_OPEN}#[bg=${SURFACE1}#,fg=${FG}]#h ,\
#[fg=${TEAL}#,bg=default]${HALF_ROUND_OPEN}}\
#[bg=${TEAL},fg=${BG}]%m-%d %H:%M\
#[fg=${TEAL},bg=default]${HALF_ROUND_CLOSE}\
"

# Only show the hostname when this tmux server was started over SSH.
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @ssh 1' 'set -gu @ssh'

# Set max length of left and right section
set-option -g status-left-length 100
set-option -g status-right-length 100

# Style and set content for the inactive windows
set-option -g window-status-format "\
 \
#I\
#[fg=${YELLOW}]:\
#[fg=default]#W\
 \
"

# Style and set content for the active windows
set-option -g window-status-current-format "\
#[fg=${PEACH},bg=default]${HALF_ROUND_OPEN}\
#[bg=${PEACH},fg=${BG}]#I \
#[bg=${SURFACE1},fg=${FG}] #W\
#[fg=${SURFACE1},bg=default]${HALF_ROUND_CLOSE}\
"

# Remove the separator between window list items, as we already have spacing
# "around" inactive items
set-option -g window-status-separator ""
