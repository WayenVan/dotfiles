patch:
  "custom_phrase/user_dict": my_custom_phrase
{{- $rimeDir := ".config/ibus/rime" -}}
{{- if eq .chezmoi.os "darwin" -}}
{{- $rimeDir = "Library/Rime" -}}
{{- end -}}
{{- $opencc := joinPath .chezmoi.homeDir $rimeDir "opencc" -}}
{{- if and (stat (joinPath $opencc "dotfiles-emoji.json")) (stat (joinPath $opencc "dotfiles-moqi_chaifen.json")) (stat (joinPath $opencc "dotfiles-moqi_chaifen_all.json")) (stat (joinPath $opencc "dotfiles-chinese_english.json")) (stat (joinPath $opencc "dotfiles-martian.json")) }}

  # Generated by rime/compile-opencc.py; rebuild after updating 白霜.
  "emoji/opencc_config": dotfiles-emoji.json
  "chaifen/opencc_config": dotfiles-moqi_chaifen.json
  "chaifen_all/opencc_config": dotfiles-moqi_chaifen_all.json
  "chinese_english/opencc_config": dotfiles-chinese_english.json
  "mars/opencc_config": dotfiles-martian.json
{{ end -}}
