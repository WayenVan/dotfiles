# Unsupported Neovim builds targeting glibc 2.17.
# This tool name is intentionally separate from the standard `neovim` tool.

[tool_alias]
neovim-oldglibc = "github:neovim/neovim-releases"
yazi-musl = "github:sxyazi/yazi"
procs = "aqua:dalance/procs"
dust = "github:bootandy/dust"
bottom = "github:ClementTsang/bottom"
chezmoi = "github:twpayne/chezmoi"
ouch = "github:ouch-org/ouch"
lazyslurm = "github:hill/lazyslurm"
tuzi = "github:WayenVan/tuzi"
portop = "github:padovanl/portop"
terminal-browser = "http:terminal-browser"
zsh-autosuggest = "http:zsh-autosuggestions"
atuin = "github:atuinsh/atuin"
opencode = "github:anomalyco/opencode"
gh = "aqua:cli/cli"

[tools.neovim-oldglibc]
version = "latest"
os = ["linux/x64"]
asset_pattern = "nvim-linux-x86_64.tar.gz"
strip_components = 1
bin_path = "bin"
# Keep this out of a bare `mise install`. The unreachable placeholder avoids
# attaching lazy installation to `nvim`, so installation remains explicit-only.
lazy = true
lazy_bins = ["__mise_manual_neovim_oldglibc__"]

[tools.yazi-musl]
version = "latest"
os = ["linux/x64"]
asset_pattern = "yazi-x86_64-unknown-linux-musl.zip"
strip_components = 1
bin_path = "."
# Keep this out of a bare `mise install`. The unreachable placeholder avoids
# attaching lazy installation to `yazi`/`ya`, so installation remains explicit-only.
lazy = true
lazy_bins = ["__mise_manual_yazi_musl__"]

[tools]
neovim = "nightly"
yazi = { version = "latest", lazy = true }
lazygit = { version = "latest", lazy = true }
lazydocker = { version = "latest", lazy = true }
fzf = { version = "latest", lazy = true }
btop = { version = "latest", lazy = true }
fastfetch = { version = "latest", lazy = true }
vhs = { version = "latest", lazy = true }
starship = { version = "latest", lazy = true }
fd = { version = "latest", lazy = true }
bat = { version = "latest", lazy = true }
glow = { version = "latest", lazy = true }
gum = { version = "latest", lazy = true }
jq = { version = "latest", lazy = true }
ripgrep = { version = "latest", lazy = true }
zoxide = { version = "latest", lazy = true }
eza = { version = "latest", lazy = true }
tmux = "3.6b"
duckdb = "latest"
# shell-gpt's own dependency resolution via mise's uv-backed pipx install
# drops `click` (a hard runtime dep of its typer CLI) -- force it in explicitly.
"pipx:shell-gpt" = { version = "latest", lazy = true, lazy_bins = [
  "sgpt",
], uvx_args = "--with click" }
"pipx:nvitop" = { version = "latest", lazy = true, lazy_bins = ["nvitop"] }
"pipx:innomd" = { version = "latest", lazy = true, lazy_bins = ["innomd"] }
"pipx:openviking" = { version = "latest", lazy = true, lazy_bins = [
  "ov",
  "openviking",
  "openviking-server",
] }

[tools.atuin]
version = "latest"
strip_components = 1
lazy = true
lazy_bins = ["atuin"]

[tools.atuin.platforms]
linux-x64 = { asset_pattern = "atuin-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "atuin-aarch64-unknown-linux-musl.tar.gz" }
macos-x64 = { asset_pattern = "atuin-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "atuin-aarch64-apple-darwin.tar.gz" }

[tools.opencode]
version = "latest"
lazy = true
lazy_bins = ["opencode"]

[tools.gh]
version = "latest"
lazy = true
lazy_bins = ["gh"]

[tools.chezmoi]
version = "latest"
lazy = true

[tools.chezmoi.platforms]
linux-x64 = { asset_pattern = "chezmoi_*_linux-musl_amd64.tar.gz" }
linux-arm64 = { asset_pattern = "chezmoi_*_linux_arm64.tar.gz" }
macos-x64 = { asset_pattern = "chezmoi_*_darwin_amd64.tar.gz" }
macos-arm64 = { asset_pattern = "chezmoi_*_darwin_arm64.tar.gz" }

[tools.dust]
version = "latest"
lazy = true

[tools.dust.platforms]
linux-x64 = { asset_pattern = "dust-v*-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "dust-v*-aarch64-unknown-linux-musl.tar.gz" }

[tools.bottom]
version = "latest"
lazy = true
lazy_bins = ["btm"]

[tools.bottom.platforms]
linux-x64 = { asset_pattern = "bottom_x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "bottom_aarch64-unknown-linux-musl.tar.gz" }
macos-x64 = { asset_pattern = "bottom_x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "bottom_aarch64-apple-darwin.tar.gz" }

[tools.procs]
version = "latest"
lazy = true
lazy_bins = ["procs"]

[tools.ouch]
version = "latest"
lazy = true
lazy_bins = ["ouch"]

[tools.ouch.platforms]
linux-x64 = { asset_pattern = "ouch-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "ouch-aarch64-unknown-linux-musl.tar.gz" }

[tools.lazyslurm]
version = "latest"
lazy = true
lazy_bins = ["lazyslurm"]

[tools.lazyslurm.platforms]
linux-x64 = { asset_pattern = "lazyslurm-x86_64-unknown-linux-musl.tar.gz" }
macos-x64 = { asset_pattern = "lazyslurm-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "lazyslurm-aarch64-apple-darwin.tar.gz" }

[tools.tuzi]
version = "latest"
lazy = true
lazy_bins = ["tuzi"]

[tools.tuzi.platforms]
linux-x64 = { asset_pattern = "tuzi-v*-x86_64-unknown-linux-musl.tar.gz" }
macos-x64 = { asset_pattern = "tuzi-v*-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "tuzi-v*-aarch64-apple-darwin.tar.gz" }

[tools.portop]
version = "latest"
lazy = true
lazy_bins = ["portop"]

[tools.portop.platforms]
linux-x64 = { asset_pattern = "portop_*_linux_amd64.tar.gz" }
linux-arm64 = { asset_pattern = "portop_*_linux_arm64.tar.gz" }
macos-x64 = { asset_pattern = "portop_*_darwin_amd64.tar.gz" }
macos-arm64 = { asset_pattern = "portop_*_darwin_arm64.tar.gz" }

# terminal-browser distributes full application bundles outside GitHub Releases.
[tools.terminal-browser]
version = "0.8.1"
strip_components = 1
bin_path = "bin"
lazy = true
lazy_bins = ["terminal-browser"]

[tools.terminal-browser.platforms]
macos-x64 = { url = "https://terminal-browser.sh/install/dl/stable/v0.8.1/terminal-browser-darwin-x64.tar.gz", checksum = "sha256:51645cfdf0428b439434776b5c2c21e50ea1200ea618c742cb3f5d65717f79dd" }
macos-arm64 = { url = "https://terminal-browser.sh/install/dl/stable/v0.8.1/terminal-browser-darwin-arm64.tar.gz", checksum = "sha256:3b0e034d557986ab9289aa8baefdca5c3eb66aa493e27110f4e82c05f224a738" }
linux-x64 = { url = "https://terminal-browser.sh/install/dl/stable/v0.8.1/terminal-browser-linux-x64.tar.gz", checksum = "sha256:35e78089d1089dc4f492bbd7d2a03d57ed5543b4394b4fddf3be57c75b77747e" }
linux-arm64 = { url = "https://terminal-browser.sh/install/dl/stable/v0.8.1/terminal-browser-linux-arm64.tar.gz", checksum = "sha256:7f90d97003eedd6ac62e61c82290ffd280f2f0e8f266911f70ab0fbac8a102fe" }

# broot's GitHub release bundles every platform's binary into a single zip
# instead of per-platform assets, so the usual github backend can't target it.
# Build from crates.io via the cargo backend instead.
[tools."cargo:broot"]
version = "latest"
lazy = true
lazy_bins = ["broot"]

[tools."cargo:somo"]
version = "latest"
lazy = true
lazy_bins = ["somo"]

# zsh-autosuggestions ships no binaries -- it's a plain shell script repo meant
# to be `source`d from .zshrc. Pull the tagged source tarball via the http
# backend just to get the files onto disk at a pinned version.
[tools.zsh-autosuggest]
version = "0.7.1"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v{{ version }}.tar.gz"
strip_components = 1
